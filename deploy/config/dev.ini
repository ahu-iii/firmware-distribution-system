; FWDS 配置模板（dev：单机开发联调，服务端和多个客户端都在本机）
; 服务端和客户端共用一份格式：fwds-server 读 [server]，fwds-client 读 [client]，
; [protocol] 和 [log] 两端都读，两端的 [protocol] 必须一致。
; 使用方法：复制一份到仓库之外（或命名为 *.local.ini），按现场修改后用 --config 指定。
; 口令和私钥不写在配置文件里：这里只写证书和（加密的）私钥文件的路径，
; 私钥口令在启动前通过环境变量 FWDS_KEY_PASSPHRASE 注入，程序读取后立即清除。
; 相对路径相对于程序启动时的工作目录。

[server]
; 监听地址和端口（必填）
listen_address=127.0.0.1
listen_port=9443
; 连接数上限：总数 / 单个 IP
max_connections=200
max_connections_per_ip=50
; SQLite 数据库文件（必填）：设备注册表、账号表、固件表、发布表。不存在时自动创建，文件权限设为仅运行账户可读写
db_file=local/data/fwds-server.db
; 固件库目录（必填）：导入的 .fwpkg 检查通过后以“包 ID.fwpkg”为名复制到这里，下发时从这里读分片。不存在时自动创建
firmware_dir=local/data/firmware
; 审计日志检查点文件：每 100 条审计日志和程序退出时写入哈希链最新的哈希，供审计员核对。
; 不填时用“db_file 加 .audit-checkpoint”。最好放在和数据库不同的位置（例如只读挂载的备份目录）
audit_checkpoint_file=local/data/fwds-server.audit-checkpoint
; 固件签名公钥 FSK（必填）及其指纹：服务端导入固件时用它验签。指纹填 fwds-signer fsk-init 显示的
; “公钥指纹”（64 个十六进制字符），文件算出的指纹与这里不一致就不启动
fsk_pub_file=local/fsk/fsk.pub.pem
fsk_pub_sha256=<FSK 公钥指纹>
; 设备登录失败锁定：同一设备 ID 或同一 IP 在 login_fail_window_s 秒内失败 login_fail_limit 次，锁定 login_lock_s 秒
login_fail_limit=5
login_fail_window_s=300
; 本机联调时所有模拟设备都在 127.0.0.1，一台配置有误就会把整个 IP 锁住，这里把锁定时长调短；test / prod 用设计值 600
login_lock_s=60
; 服务端证书和私钥（必填）。由 fwds-signer issue-cert --type server 签发
cert_file=local/pki/server/server.pem
key_file=local/pki/server/server.key

[client]
; 服务端主机名或 IP、端口（必填）。server_host 必须与服务端证书名称一致
server_host=127.0.0.1
server_port=9443
; 本设备的 ID 和型号（必填）。device_id 必须与设备证书名称一致
device_id=DEV-001
model=PLC-X200
; 设备证书和私钥（必填）。由 fwds-signer issue-cert --type device 签发，每台设备一套
cert_file=local/pki/DEV-001/device.pem
key_file=local/pki/DEV-001/device.key
; 设备数据目录（必填）：模拟 Flash 的两个固件分区 slot_a/、slot_b/，启动配置 boot.json，下载目录 download/。
; 多开时每台设备用自己的目录
data_dir=local/device/DEV-001
; 固件签名公钥 FSK（必填）及其指纹。公钥文件随设备出厂写入；指纹填 fwds-signer fsk-init 显示的
; “公钥指纹”（64 个十六进制字符）。启动时文件算出的指纹与这里不一致就不运行，防止装错公钥
fsk_pub_file=local/fsk/fsk.pub.pem
fsk_pub_sha256=<FSK 公钥指纹>
; 模拟重启的时长（毫秒），只影响演示时 REBOOTING 状态停留多久
reboot_delay_ms=2000

[rollout]
; 灰度发布（设计 4.2 节）。observe_s：金丝雀全部成功后观察多少秒，期间无失败、无告警才进入“待确认全量”
observe_s=30
; 新建发布时“同时推送台数”的默认值（并发上限 K）
concurrency=5
; 全量阶段失败台数超过全量目标的这个百分比时自动暂停（0 表示失败一台就暂停）
max_failure_pct=20

[tls]
; 自建 CA 根证书和吊销列表（必填）。两端只信任这一张根证书；CRL 文件更新后下一次握手自动重新加载
ca_file=local/pki/server/ca.pem
crl_file=local/pki/server/crl.pem
; 证书有效期上限（天）：根证书 / 服务端和设备证书。超过上限的证书签发工具不签、两端也不接受。
; 课程规定的上限确定后改这两项即可，签发工具和两端要用同一组值
max_ca_cert_days=365
max_cert_days=90

[signer]
; 只有 fwds-signer 读取：CRL 的有效天数，到期前需要 update-crl 重新生成并分发
crl_valid_days=30

[protocol]
; 以下为协议文档第 8 节的默认值，单位毫秒
login_timeout_ms=10000
heartbeat_interval_ms=5000
heartbeat_timeout_ms=15000
login_ts_window_ms=60000
; 帧消息体上限（字节），只能调小：不能超过 1048576，也不能小于 65560（否则一片固件装不进一帧）
max_frame_body=1048576
; 分片下载：一次请求的片数（1 ~ 16）/ 一个窗口等不齐时多久后重新请求 / 同一片哈希连续不符几次就中止
chunk_window=16
chunk_window_timeout_ms=10000
chunk_retry_limit=3
; 断线重连的等待序列，取到最后一个值后保持不变
reconnect_backoff_ms=1000,2000,4000,8000,16000,30000

[log]
; DEBUG / INFO / WARN / ERROR
level=DEBUG
