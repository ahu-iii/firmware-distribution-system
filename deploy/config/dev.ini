; FWDS 配置模板（dev：单机开发联调，服务端和多个客户端都在本机）
; 服务端和客户端共用一份格式：fwds-server 读 [server]，fwds-client 读 [client]，
; [protocol] 和 [log] 两端都读，两端的 [protocol] 必须一致。
; 使用方法：复制一份到仓库之外（或命名为 *.local.ini），按现场修改后用 --config 指定。
; 口令和私钥不写在配置文件里：这里只写证书和（加密的）私钥文件的路径，
; 私钥口令在启动前通过环境变量 FWDS_KEY_PASSPHRASE 注入，程序读取后立即清除。
; 相对路径相对于程序启动时的工作目录。

[server]
; 监听地址和端口（必填）
listen_address=127.0.0.1
listen_port=9443
; 连接数上限：总数 / 单个 IP
max_connections=200
max_connections_per_ip=50
; 服务端证书和私钥（必填）。由 fwds-signer issue-cert --type server 签发
cert_file=local/pki/server/server.pem
key_file=local/pki/server/server.key

[client]
; 服务端主机名或 IP、端口（必填）。server_host 必须与服务端证书名称一致
server_host=127.0.0.1
server_port=9443
; 本设备的 ID 和型号（必填）。device_id 必须与设备证书名称一致
device_id=DEV-001
model=PLC-X200
; 设备证书和私钥（必填）。由 fwds-signer issue-cert --type device 签发，每台设备一套
cert_file=local/pki/DEV-001/device.pem
key_file=local/pki/DEV-001/device.key

[tls]
; 自建 CA 根证书和吊销列表（必填）。两端只信任这一张根证书；CRL 文件更新后下一次握手自动重新加载
ca_file=local/pki/server/ca.pem
crl_file=local/pki/server/crl.pem
; 证书有效期上限（天）：根证书 / 服务端和设备证书。超过上限的证书签发工具不签、两端也不接受。
; 课程规定的上限确定后改这两项即可，签发工具和两端要用同一组值
max_ca_cert_days=365
max_cert_days=90

[signer]
; 只有 fwds-signer 读取：CRL 的有效天数，到期前需要 update-crl 重新生成并分发
crl_valid_days=30

[protocol]
; 以下为协议文档第 8 节的默认值，单位毫秒
login_timeout_ms=10000
heartbeat_interval_ms=5000
heartbeat_timeout_ms=15000
login_ts_window_ms=60000
; 帧消息体上限（字节），只能调小，不能超过 1048576
max_frame_body=1048576
; 断线重连的等待序列，取到最后一个值后保持不变
reconnect_backoff_ms=1000,2000,4000,8000,16000,30000

[log]
; DEBUG / INFO / WARN / ERROR
level=DEBUG
